<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codes Watch</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <div class="shell">
    <aside class="side" aria-label="Jeux surveillés">
      <a class="brand" href="#/">Codes Watch</a>
      <label class="search"><span class="sr">Rechercher un jeu</span><input id="gameSearch" type="search" placeholder="Rechercher un jeu" autocomplete="off"></label>
      <nav id="gameNav"></nav>
      <button id="openSettings" class="btn ghost" type="button">Réglages</button>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="banner" class="banner" role="status" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="settings" aria-labelledby="settingsTitle"></dialog>
  <noscript>Ce tableau de bord a besoin de JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
